<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Finder</title>
    <link rel="stylesheet" href="GithubProfileFinder.css">
</head>

<body>
    <div class="container">

    <div class="search-box">
        <input
            type="text"
            id="username"
            placeholder="Enter GitHub username"
        >

        <button id="searchBtn">Search</button>
    </div>

    <p id="error" class="error"></p>

    <div class="card" id="card">
        <img id="avatar" src="" alt="Profile">

        <h2 id="name"></h2>

        <p id="bio"></p>

        <div class="stats">
            <div>
                <h3 id="followers"></h3>
                <p>Followers</p>
            </div>

            <div>
                <h3 id="following"></h3>
                <p>Following</p>
            </div>

            <div>
                <h3 id="repos"></h3>
                <p>Repos</p>
            </div>
        </div>
    </div>

</div>
</body>
<script src="GithubProfileFinder.js"></script>
</html>
